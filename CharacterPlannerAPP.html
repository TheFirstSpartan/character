<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreFlow | Daily Local Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .tab-active { color: #4F46E5; border-bottom: 2px solid #4F46E5; }
        .picked-note { border-color: #fbbf24 !important; background-color: #fffbeb !important; }
        .streak-badge { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* BGM Player Style - KOF 2002 Arcade Vibe */
        .bgm-container {
            background: linear-gradient(90deg, #1e1b4b 0%, #312e81 100%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        audio::-webkit-media-controls-panel {
            background-color: #312e81;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #818cf8;
            font-family: monospace;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24">

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-indigo-600">CoreFlow</h1>
                <p id="currentDate" class="text-xs text-slate-500 font-medium uppercase tracking-wider"></p>
            </div>
            <div class="flex items-center gap-2 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-100 streak-badge">
                <span class="text-lg">🔥</span>
                <span id="streakCount" class="font-bold text-indigo-700">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 mt-4">
        
        <!-- BGM Uploader Section -->
        <section id="bgm-section" class="mb-6">
            <div class="bgm-container rounded-2xl p-4 border border-indigo-900">
                <div class="flex items-center justify-between mb-2">
                    <label for="bgm-upload" class="cursor-pointer flex items-center gap-2 text-[10px] font-bold text-indigo-300 uppercase tracking-widest hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                        Upload BGM
                    </label>
                    <span id="bgm-name" class="text-[10px] text-indigo-400 truncate max-w-[150px] font-mono">No Track Loaded</span>
                    <input type="file" id="bgm-upload" accept="audio/*" class="hidden" onchange="handleBgmUpload(event)">
                </div>
                <audio id="bgm-player" controls loop class="w-full h-8 opacity-80 hover:opacity-100 transition-opacity"></audio>
            </div>
        </section>

        <nav class="flex border-b border-slate-200 mb-6 sticky top-[73px] bg-slate-50/90 backdrop-blur-sm py-2 z-20">
            <button onclick="switchTab('braindump')" id="btn-braindump" class="flex-1 py-2 text-sm font-semibold tab-active">Brain Dump</button>
            <button onclick="switchTab('meals')" id="btn-meals" class="flex-1 py-2 text-sm font-semibold text-slate-400">Meal Plan</button>
            <button onclick="switchTab('workouts')" id="btn-workouts" class="flex-1 py-2 text-sm font-semibold text-slate-400">Workout</button>
            <button onclick="switchTab('stats')" id="btn-stats" class="flex-1 py-2 text-sm font-semibold text-slate-400">Stats</button>
        </nav>

        <!-- BRAIN DUMP VIEW -->
        <div id="view-braindump" class="space-y-4">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-slate-800">Thoughts</h3>
                    <div class="flex gap-2">
                        <button onclick="moveToVault()" class="text-[10px] bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-bold hover:bg-slate-200">Archive to Vault</button>
                        <button onclick="addNote()" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-semibold hover:bg-indigo-100">+ New Note</button>
                    </div>
                </div>
                <div id="notes-list" class="space-y-3"></div>
                
                <div id="vault-section" class="mt-8 pt-6 border-t border-slate-100 hidden">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">The Vault</h4>
                    <div id="vault-list" class="space-y-2 opacity-60 max-h-[200px] overflow-y-auto"></div>
                </div>
                <button id="btn-toggle-vault" onclick="toggleVault()" class="w-full mt-4 text-xs text-slate-400 font-medium hover:text-indigo-500 transition-colors">Show Vaulted Thoughts</button>
            </div>
        </div>

        <!-- MEAL PLAN VIEW -->
        <div id="view-meals" class="hidden space-y-4">
            <div id="meal-status-banner" class="hidden bg-emerald-50 border border-emerald-100 p-3 rounded-2xl flex items-center justify-between">
                <span class="text-xs font-bold text-emerald-700 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                    PLAN LOCKED & COMMITTED
                </span>
                <button onclick="toggleMealLock()" class="text-[10px] font-bold text-emerald-600 hover:underline">Edit Plan</button>
            </div>

            <button onclick="generateAiMeals()" id="btn-generate-meals" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 mb-2 hover:opacity-90 transition-opacity">
                <span>✨</span> Generate Daily Fuel <span>✨</span>
            </button>
            
            <div class="space-y-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm transition-all" id="card-breakfast">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-3">
                            <span class="p-2 bg-orange-100 rounded-lg text-lg">🍳</span>
                            <h3 class="font-bold text-slate-700">Breakfast</h3>
                        </div>
                        <input type="checkbox" id="check-breakfast" onchange="saveData()" class="meal-check hidden w-6 h-6 rounded-full border-slate-300 text-emerald-500 focus:ring-emerald-500">
                    </div>
                    <textarea id="meal-breakfast" oninput="saveData()" class="w-full bg-slate-50 rounded-xl p-3 text-sm border-none focus:ring-2 focus:ring-indigo-500 min-h-[80px]" placeholder="Start your day with..."></textarea>
                </div>
                
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm transition-all" id="card-lunch">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-3">
                            <span class="p-2 bg-blue-100 rounded-lg text-lg">🥗</span>
                            <h3 class="font-bold text-slate-700">Lunch</h3>
                        </div>
                        <input type="checkbox" id="check-lunch" onchange="saveData()" class="meal-check hidden w-6 h-6 rounded-full border-slate-300 text-emerald-500 focus:ring-emerald-500">
                    </div>
                    <textarea id="meal-lunch" oninput="saveData()" class="w-full bg-slate-50 rounded-xl p-3 text-sm border-none focus:ring-2 focus:ring-indigo-500 min-h-[80px]" placeholder="Fuel for the afternoon..."></textarea>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm transition-all" id="card-dinner">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-3">
                            <span class="p-2 bg-purple-100 rounded-lg text-lg">🍱</span>
                            <h3 class="font-bold text-slate-700">Dinner</h3>
                        </div>
                        <input type="checkbox" id="check-dinner" onchange="saveData()" class="meal-check hidden w-6 h-6 rounded-full border-slate-300 text-emerald-500 focus:ring-emerald-500">
                    </div>
                    <textarea id="meal-dinner" oninput="saveData()" class="w-full bg-slate-50 rounded-xl p-3 text-sm border-none focus:ring-2 focus:ring-indigo-500 min-h-[80px]" placeholder="Ending the day right..."></textarea>
                </div>
            </div>

            <button id="btn-lock-meals" onclick="toggleMealLock()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Lock In Today's Plan
            </button>
        </div>

        <!-- WORKOUT VIEW -->
        <div id="view-workouts" class="hidden space-y-4">
            <button onclick="generateWorkoutPlan()" id="btn-generate-workout" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 mb-2 hover:bg-slate-800 transition-all">
                <span class="text-xl">🥊</span> Generate 25min Training 
            </button>

            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <h3 class="font-bold text-lg mb-4 flex justify-between items-center text-slate-800">
                    Routine
                    <button onclick="addExercise()" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-semibold hover:bg-indigo-100">+ Add Move</button>
                </h3>
                <div id="workout-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- STATS VIEW -->
        <div id="view-stats" class="hidden">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center">
                <h3 class="font-bold text-slate-800 mb-2">Consistency Map</h3>
                <div id="heatmap" class="grid grid-cols-7 gap-2"></div>
                <div class="mt-8 pt-6 border-t border-slate-100 flex justify-around">
                    <div>
                        <p class="text-2xl font-bold text-indigo-600" id="stat-total-days">0</p>
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Days Active</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-emerald-500" id="stat-best-streak">0</p>
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Current Streak</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const todayKey = new Date().toISOString().split('T')[0];
        let currentTab = 'braindump';
        let isGenerating = false;
        
        let appData = {
            streak: 0,
            lastVisit: '',
            history: {},
            vault: [] 
        };

        window.onload = () => {
            loadFromStorage();
            updateDateDisplay();
            processStreak();
            renderCurrentDay();
            switchTab('braindump');
        };

        function handleBgmUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const player = document.getElementById('bgm-player');
                const nameDisplay = document.getElementById('bgm-name');
                
                player.src = url;
                nameDisplay.innerText = file.name;
                player.play();
            }
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('coreflow_data');
            if (saved) {
                appData = JSON.parse(saved);
            }
            if (!appData.history[todayKey]) {
                appData.history[todayKey] = {
                    notes: [],
                    meals: { breakfast: '', lunch: '', dinner: '', locked: false, completed: {} },
                    workouts: []
                };
            }
        }

        function saveData() {
            const day = appData.history[todayKey];
            if (!day) return;

            if (document.getElementById('meal-breakfast')) {
                day.meals.breakfast = document.getElementById('meal-breakfast').value;
                day.meals.lunch = document.getElementById('meal-lunch').value;
                day.meals.dinner = document.getElementById('meal-dinner').value;
                day.meals.completed = {
                    breakfast: document.getElementById('check-breakfast').checked,
                    lunch: document.getElementById('check-lunch').checked,
                    dinner: document.getElementById('check-dinner').checked
                };
            }
            localStorage.setItem('coreflow_data', JSON.stringify(appData));
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tab}`)?.classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('tab-active');
                el.classList.add('text-slate-400');
            });
            document.getElementById(`btn-${tab}`)?.classList.add('tab-active');
            document.getElementById(`btn-${tab}`)?.classList.remove('text-slate-400');

            if(tab === 'stats') renderHeatmap();
        }

        function toggleMealLock() {
            const day = appData.history[todayKey];
            day.meals.locked = !day.meals.locked;
            saveData();
            applyMealLockState(day.meals.locked);
        }

        function applyMealLockState(isLocked) {
            const banner = document.getElementById('meal-status-banner');
            const lockBtn = document.getElementById('btn-lock-meals');
            const genBtn = document.getElementById('btn-generate-meals');
            const checks = document.querySelectorAll('.meal-check');
            const inputs = ['meal-breakfast', 'meal-lunch', 'meal-dinner'];

            if (isLocked) {
                banner?.classList.remove('hidden');
                lockBtn?.classList.add('hidden');
                genBtn?.classList.add('opacity-50', 'pointer-events-none');
                inputs.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) { el.readOnly = true; el.classList.add('bg-slate-100'); }
                });
                checks.forEach(c => c.classList.remove('hidden'));
            } else {
                banner?.classList.add('hidden');
                lockBtn?.classList.remove('hidden');
                genBtn?.classList.remove('opacity-50', 'pointer-events-none');
                inputs.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) { el.readOnly = false; el.classList.remove('bg-slate-100'); }
                });
                checks.forEach(c => c.classList.add('hidden'));
            }
        }

        function renderCurrentDay() {
            const day = appData.history[todayKey];
            if (!day) return;

            const breakfastEl = document.getElementById('meal-breakfast');
            if (breakfastEl) {
                breakfastEl.value = day.meals.breakfast || '';
                document.getElementById('meal-lunch').value = day.meals.lunch || '';
                document.getElementById('meal-dinner').value = day.meals.dinner || '';
                document.getElementById('check-breakfast').checked = day.meals.completed?.breakfast || false;
                document.getElementById('check-lunch').checked = day.meals.completed?.lunch || false;
                document.getElementById('check-dinner').checked = day.meals.completed?.dinner || false;
            }

            applyMealLockState(day.meals.locked);
            renderNotes();
            renderWorkouts();
        }

        async function callGemini(prompt) {
            const apiKey = ""; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });
            return await response.json();
        }

        async function generateAiMeals() {
            if (isGenerating) return;
            const btn = document.getElementById('btn-generate-meals');
            const original = btn.innerHTML;
            try {
                isGenerating = true;
                btn.innerHTML = '<span>⏳</span> Preparing...';
                const prompt = "Generate 3 healthy meal ideas for Breakfast, Lunch, and Dinner. Use emojis. Format as JSON: {breakfast, lunch, dinner}";
                const result = await callGemini(prompt);
                const meals = JSON.parse(result.candidates[0].content.parts[0].text);
                document.getElementById('meal-breakfast').value = meals.breakfast;
                document.getElementById('meal-lunch').value = meals.lunch;
                document.getElementById('meal-dinner').value = meals.dinner;
                saveData();
            } catch (e) { console.error(e); } finally { isGenerating = false; btn.innerHTML = original; }
        }

        async function generateWorkoutPlan() {
            if (isGenerating) return;
            const btn = document.getElementById('btn-generate-workout');
            const original = btn.innerHTML;
            try {
                isGenerating = true;
                btn.innerHTML = '<span>⚡</span> Training Load...';
                const prompt = `Generate a high-intensity 25-minute workout plan. Theme: Neo Geo KOF 2002 style. Include 5-7 exercises. Return JSON array: [{"text": "Exercise + Emojis"}]`;
                const result = await callGemini(prompt);
                const plan = JSON.parse(result.candidates[0].content.parts[0].text);
                appData.history[todayKey].workouts = plan.map(item => ({ text: item.text, done: false }));
                saveData();
                renderWorkouts();
            } catch (e) { console.error(e); } finally { isGenerating = false; btn.innerHTML = original; }
        }

        function addNote() {
            appData.history[todayKey].notes.unshift({ text: '', picked: false });
            saveData();
            renderNotes();
        }

        function renderNotes() {
            const list = document.getElementById('notes-list');
            const notes = appData.history[todayKey].notes || [];
            list.innerHTML = notes.map((n, i) => `
                <div class="bg-slate-50 p-3 rounded-xl border-2 ${n.picked ? 'picked-note' : 'border-transparent'} flex items-start gap-2">
                    <button onclick="togglePickNote(${i})" class="${n.picked ? 'text-amber-500' : 'text-slate-200'} text-xl">★</button>
                    <textarea oninput="updateNoteText(${i}, this.value)" class="w-full bg-transparent border-none text-sm focus:ring-0 resize-none min-h-[40px]">${n.text}</textarea>
                    <button onclick="removeNote(${i})" class="text-slate-300 px-1">✕</button>
                </div>
            `).join('') || '<p class="text-slate-400 text-sm text-center py-4 italic">Empty mind, empty space.</p>';
            renderVault();
        }

        function togglePickNote(i) {
            const notes = appData.history[todayKey].notes;
            if (!notes[i].picked && notes.filter(n => n.picked).length >= 3) return;
            notes[i].picked = !notes[i].picked;
            saveData(); renderNotes();
        }

        function updateNoteText(i, v) { appData.history[todayKey].notes[i].text = v; saveData(); }
        function removeNote(i) { appData.history[todayKey].notes.splice(i, 1); saveData(); renderNotes(); }

        function moveToVault() {
            const day = appData.history[todayKey];
            const unpicked = day.notes.filter(n => !n.picked && n.text.trim());
            appData.vault = [...unpicked, ...appData.vault];
            day.notes = day.notes.filter(n => n.picked);
            saveData(); renderNotes();
        }

        function renderVault() {
            const list = document.getElementById('vault-list');
            list.innerHTML = appData.vault.map(v => `<div class="bg-white p-2 rounded-lg border border-slate-100 text-[11px]">${v.text}</div>`).join('');
        }

        function toggleVault() {
            const isH = document.getElementById('vault-section').classList.toggle('hidden');
            document.getElementById('btn-toggle-vault').innerText = isH ? 'Show Vaulted Thoughts' : 'Hide Vault';
        }

        function addExercise() { 
            if(!appData.history[todayKey].workouts) appData.history[todayKey].workouts = [];
            appData.history[todayKey].workouts.push({ text: '', done: false }); 
            saveData(); renderWorkouts(); 
        }
        
        function renderWorkouts() {
            const list = document.getElementById('workout-list');
            const ws = appData.history[todayKey].workouts || [];
            list.innerHTML = ws.map((w, i) => `
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl">
                    <input type="checkbox" ${w.done ? 'checked' : ''} onchange="toggleWorkout(${i})" class="w-5 h-5 rounded-full border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <input type="text" value="${w.text}" oninput="updateWorkoutText(${i}, this.value)" class="flex-1 bg-transparent border-none text-sm ${w.done ? 'line-through text-slate-400' : 'text-slate-700'}">
                    <button onclick="removeWorkout(${i})" class="text-slate-300 px-1">✕</button>
                </div>
            `).join('') || '<p class="text-slate-400 text-sm text-center py-4 italic">No exercises planned.</p>';
        }

        function toggleWorkout(i) { appData.history[todayKey].workouts[i].done = !appData.history[todayKey].workouts[i].done; saveData(); renderWorkouts(); }
        function updateWorkoutText(i, v) { appData.history[todayKey].workouts[i].text = v; saveData(); }
        function removeWorkout(i) { appData.history[todayKey].workouts.splice(i, 1); saveData(); renderWorkouts(); }

        function processStreak() {
            const last = appData.lastVisit;
            if (last !== todayKey) {
                const y = new Date(); y.setDate(y.getDate() - 1);
                if (last === y.toISOString().split('T')[0]) { appData.streak++; } 
                else if (last === '') { appData.streak = 1; }
                else { appData.streak = 1; }
                appData.lastVisit = todayKey;
                saveData();
            }
            document.getElementById('streakCount').innerText = appData.streak;
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmap');
            container.innerHTML = '';
            document.getElementById('stat-total-days').innerText = Object.keys(appData.history).length;
            document.getElementById('stat-best-streak').innerText = appData.streak;
            for (let i = 27; i >= 0; i--) {
                const d = new Date(); d.setDate(d.getDate() - i);
                const isActive = appData.history[d.toISOString().split('T')[0]];
                const dot = document.createElement('div');
                dot.className = `aspect-square rounded-sm ${isActive ? 'bg-indigo-500' : 'bg-slate-200'}`;
                container.appendChild(dot);
            }
        }

        function updateDateDisplay() {
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
